<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProcureBot</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <h1>ProcureBot</h1>
    <p class="sub">Procurement assistant — supplier lookups, compliance, raise POs</p>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form">
    <input
      id="input"
      autocomplete="off"
      placeholder="Ask about a supplier, or 'raise a PO for…'"
      required
    />
    <button type="submit">Send</button>
  </form>

  <footer>
    <button id="reset" type="button">New session</button>
    <span id="session-info"></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
