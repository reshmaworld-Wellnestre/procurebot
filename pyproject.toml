[project]
name = "procurebot"
version = "0.1.0"
description = "ProcureBot — procurement assistant (standalone Python build of the Copilot Studio spec)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["procurebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
